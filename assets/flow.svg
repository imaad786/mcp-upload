<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 762" width="960" height="762" role="img" aria-labelledby="t d"><title id="t">How a file reaches an MCP tool with mcp-upload</title><desc id="d">Two flows. A: a tool returns a single-use upload URL; whoever holds the file POSTs it there; the gateway redeems the ticket once and streams the bytes to your backend or sink; the tool reports completed with size and SHA-256. B: the client sends files/authorizeUpload with name, type, size and digest, gets a file URI and an upload descriptor, posts the bytes, then calls a tool with the mcp-file URI, which the tool resolves and claims once. MCP messages carry only a URL or a URI; the bytes go over HTTP.</desc><style>
text { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif; font-size: 15px; fill: #1f2328; }
.mono { font-family: ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace; font-size: 14.5px; }
.muted { fill: #59636e; }
.title { font-size: 17px; font-weight: 600; }
.cap { font-size: 14.5px; fill: #59636e; }
.strong { font-weight: 600; }
.c-mcp { fill: #0969da; }
.c-byte { fill: #bc4c00; }
.lane { fill: #f6f8fa; stroke: #d1d9e0; stroke-width: 1; }
.box { fill: #ffffff; stroke: #d1d9e0; stroke-width: 1.25; }
.dest { fill: #ffffff; stroke: #bc4c00; stroke-width: 1.5; }
.num-mcp { fill: #0969da; }
.num-byte { fill: #bc4c00; }
.num { fill: #ffffff; font-size: 13.5px; font-weight: 700; }
.a-mcp { stroke: #0969da; stroke-width: 2; fill: none; }
.a-byte { stroke: #bc4c00; stroke-width: 3.5; fill: none; }
.a-step { stroke: #59636e; stroke-width: 1.75; fill: none; stroke-dasharray: 5 4; }
.h-mcp { fill: #0969da; }
.h-byte { fill: #bc4c00; }
.h-step { fill: #59636e; }
.lbl-bg { fill: #f6f8fa; }
@media (prefers-color-scheme: dark) {
  text { fill: #e6edf3; }
  .muted, .cap { fill: #9198a1; }
  .c-mcp { fill: #4493f8; }
  .c-byte { fill: #f0883e; }
  .lane { fill: #151b23; stroke: #3d444d; }
  .box { fill: #0d1117; stroke: #3d444d; }
  .dest { fill: #0d1117; stroke: #f0883e; }
  .num-mcp { fill: #4493f8; }
  .num-byte { fill: #f0883e; }
  .num { fill: #0d1117; }
  .a-mcp { stroke: #4493f8; }
  .a-byte { stroke: #f0883e; }
  .a-step { stroke: #9198a1; }
  .h-mcp { fill: #4493f8; }
  .h-byte { fill: #f0883e; }
  .h-step { fill: #9198a1; }
  .lbl-bg { fill: #151b23; }
}
</style><defs><marker id="m-mcp" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse" markerUnits="userSpaceOnUse"><path class="h-mcp" d="M0,0 L10,5 L0,10 z"/></marker><marker id="m-byte" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="13" markerHeight="13" orient="auto-start-reverse" markerUnits="userSpaceOnUse"><path class="h-byte" d="M0,0 L10,5 L0,10 z"/></marker><marker id="m-step" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse" markerUnits="userSpaceOnUse"><path class="h-step" d="M0,0 L10,5 L0,10 z"/></marker></defs><text x="20" y="30" class="title"><tspan class="strong">A  </tspan><tspan class="strong">The tool asks for a file</tspan></text><text x="940" y="30" text-anchor="end"><tspan class="muted">a single-use upload URL</tspan></text><rect class="lane" x="20" y="46" width="920" height="151" rx="10"/><text x="36" y="68"><tspan class="strong c-mcp">MCP</tspan><tspan class="muted">  carries a URL or a URI, never the bytes</tspan></text><rect class="lane" x="20" y="211" width="920" height="151" rx="10"/><text x="36" y="233"><tspan class="strong c-byte">HTTP</tspan><tspan class="muted">  carries the file bytes</tspan></text><rect class="box" x="34" y="80" width="290" height="103" rx="8"/><circle class="num-mcp" cx="56" cy="101" r="11"/><text class="num" x="56" y="106" text-anchor="middle">1</text><text x="74" y="105" class="cap"><tspan>model → server</tspan></text><text x="48" y="129"><tspan class="mono">tools/call request_upload</tspan></text><text x="48" y="150"><tspan>gateway issues a single-use ticket</tspan></text><text x="48" y="171"><tspan>tool returns </tspan><tspan class="mono">upload.url</tspan></text><rect class="box" x="214" y="245" width="266" height="103" rx="8"/><circle class="num-byte" cx="236" cy="266" r="11"/><text class="num" x="236" y="271" text-anchor="middle">2</text><text x="254" y="270" class="cap"><tspan>whoever holds the file</tspan></text><text x="228" y="294"><tspan>a person, on the upload page,</tspan></text><text x="228" y="315"><tspan>or an agent: </tspan><tspan class="mono">curl -F file=@…</tspan></text><text x="228" y="336"><tspan>POSTs it to the URL</tspan></text><rect class="box" x="526" y="245" width="236" height="103" rx="8"/><circle class="num-byte" cx="548" cy="266" r="11"/><text class="num" x="548" y="271" text-anchor="middle">3</text><text x="566" y="270" class="cap"><tspan>gateway</tspan></text><text x="540" y="294"><tspan>checks the headers</tspan></text><text x="540" y="315"><tspan>redeems the ticket, once</tspan></text><text x="540" y="336"><tspan>streams the bytes on</tspan></text><rect class="dest" x="800" y="245" width="126" height="103" rx="8"/><text x="863" y="293.5" text-anchor="middle"><tspan class="strong">your backend</tspan></text><text x="863" y="315.5" text-anchor="middle"><tspan class="strong">or sink</tspan></text><rect class="box" x="566" y="80" width="360" height="103" rx="8"/><circle class="num-mcp" cx="588" cy="101" r="11"/><text class="num" x="588" y="106" text-anchor="middle">4</text><text x="606" y="105" class="cap"><tspan>tool reports the outcome</tspan></text><text x="580" y="129"><tspan class="mono">completed</tspan><tspan>, with size and SHA-256</tspan></text><text x="580" y="150"><tspan class="mono">check_upload</tspan><tspan> reads it later.</tspan></text><text x="580" y="171"><tspan>the upload response carries it too</tspan></text><path class="a-mcp" d="M262,183 L262,243" marker-end="url(#m-mcp)"/><rect class="lbl-bg" x="268.0" y="204.0" width="96.0" height="20" rx="3"/><text x="272" y="219.0"><tspan class="mono">upload.url</tspan></text><path class="a-byte" d="M480,296.5 L523,296.5" marker-end="url(#m-byte)"/><path class="a-byte" d="M762,296.5 L797,296.5" marker-end="url(#m-byte)"/><path class="a-step" d="M640,245 L640,185" marker-end="url(#m-step)"/><rect class="lbl-bg" x="646.0" y="204.0" width="53.6" height="20" rx="3"/><text x="650" y="219.0"><tspan class="muted">record</tspan></text><text x="20" y="410" class="title"><tspan class="strong">B  </tspan><tspan class="strong">The client uploads first</tspan></text><text x="940" y="410" text-anchor="end"><tspan class="mono">files/authorizeUpload</tspan><tspan class="muted">  (SEP-2631)</tspan></text><rect class="lane" x="20" y="426" width="920" height="151" rx="10"/><text x="36" y="448"><tspan class="strong c-mcp">MCP</tspan><tspan class="muted">  carries a URL or a URI, never the bytes</tspan></text><rect class="lane" x="20" y="591" width="920" height="151" rx="10"/><text x="36" y="613"><tspan class="strong c-byte">HTTP</tspan><tspan class="muted">  carries the file bytes</tspan></text><rect class="box" x="34" y="460" width="300" height="103" rx="8"/><circle class="num-mcp" cx="56" cy="481" r="11"/><text class="num" x="56" y="486" text-anchor="middle">1</text><text x="74" y="485" class="cap"><tspan>client → server</tspan></text><text x="48" y="509"><tspan class="mono">files/authorizeUpload</tspan></text><text x="48" y="530"><tspan class="mono">{name, mimeType, size, digest}</tspan></text><text x="48" y="551"><tspan>returns </tspan><tspan class="mono">file.uri</tspan><tspan> + </tspan><tspan class="mono">upload</tspan></text><rect class="box" x="244" y="625" width="300" height="103" rx="8"/><circle class="num-byte" cx="266" cy="646" r="11"/><text class="num" x="266" y="651" text-anchor="middle">2</text><text x="284" y="650" class="cap"><tspan>client → gateway</tspan></text><text x="258" y="674"><tspan>POSTs the bytes to </tspan><tspan class="mono">upload.url</tspan></text><text x="258" y="695"><tspan>size and digest must match</tspan></text><text x="258" y="716"><tspan>streams the bytes on</tspan></text><rect class="dest" x="800" y="625" width="126" height="103" rx="8"/><text x="863" y="673.5" text-anchor="middle"><tspan class="strong">your backend</tspan></text><text x="863" y="695.5" text-anchor="middle"><tspan class="strong">or sink</tspan></text><rect class="box" x="488" y="460" width="240" height="103" rx="8"/><circle class="num-mcp" cx="510" cy="481" r="11"/><text class="num" x="510" y="486" text-anchor="middle">3</text><text x="528" y="485" class="cap"><tspan>client → tool</tspan></text><text x="502" y="509"><tspan class="mono">tools/call ingest</tspan></text><text x="502" y="530"><tspan class="mono">{file: &quot;mcp-file://…&quot;}</tspan></text><text x="502" y="551"><tspan>only the URI</tspan></text><rect class="box" x="762" y="460" width="164" height="103" rx="8"/><circle class="num-mcp" cx="784" cy="481" r="11"/><text class="num" x="784" y="486" text-anchor="middle">4</text><text x="802" y="485" class="cap"><tspan>tool</tspan></text><text x="776" y="509"><tspan class="mono">resolve_file</tspan></text><text x="776" y="530"><tspan>checks the owner,</tspan></text><text x="776" y="551"><tspan>claims it once</tspan></text><path class="a-mcp" d="M290,563 L290,623" marker-end="url(#m-mcp)"/><rect class="lbl-bg" x="296.0" y="584.0" width="96.0" height="20" rx="3"/><text x="300" y="599.0"><tspan class="mono">upload.url</tspan></text><path class="a-byte" d="M544,676.5 L797,676.5" marker-end="url(#m-byte)"/><path class="a-step" d="M522,625 L522,565" marker-end="url(#m-step)"/><rect class="lbl-bg" x="477.6" y="584.0" width="38.4" height="20" rx="3"/><text x="512" y="599.0" text-anchor="end"><tspan class="muted">then</tspan></text><path class="a-mcp" d="M728,511.5 L759,511.5" marker-end="url(#m-mcp)"/></svg>
