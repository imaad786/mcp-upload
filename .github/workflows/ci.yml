name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 3.14 joins the matrix once streaming-form-data publishes a cp314 wheel.
        python-version: ["3.11", "3.12", "3.13"]
        # One lane per server framework. fastmcp 3.x pins mcp<2, so the two extras
        # cannot be installed together. Core tests run in both lanes.
        framework: ["mcp", "fastmcp"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,${{ matrix.framework }}]"
      - name: Lint
        run: ruff check .
      - name: Format check
        run: ruff format --check .
      - name: Type check
        run: mypy
      - name: Test
        run: pytest
